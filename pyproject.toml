[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-webhook-ingestion"
version = "0.1.0"
description = "Secure, idempotent Azure Function webhook ingestion with raw-event audit history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["azure-functions>=1.21,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["webhook_ingestion*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
